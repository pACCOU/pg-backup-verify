[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-backup-verify"
version = "1.0.0"
description = "Dump a PostgreSQL database, restore it into a scratch DB, verify row counts, emit a JSON report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Florian Whannou" }]
dependencies = ["psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pgbv = "pgbv.cli:main"

[tool.setuptools.packages.find]
include = ["pgbv*"]
